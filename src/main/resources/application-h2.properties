# Perfil "h2": base de datos en memoria, sin Docker ni MariaDB.
# Crea las tablas y carga los datos con los mismos scripts que MariaDB,
# así que sirve para los tests y para trabajar en las vistas sin Docker.
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# Los cambios se pierden al parar la aplicación.
spring.datasource.url=jdbc:h2:mem:biblioteca;MODE=MariaDB;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/01-esquema.sql
spring.sql.init.data-locations=classpath:db/02-datos.sql
