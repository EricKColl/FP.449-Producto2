<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo préstamo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('prestamos')}"></nav>
<main class="container py-4">
    <th:block th:replace="~{fragments/layout :: alertas}"></th:block>
    <h1 class="h3 mb-3">Nuevo préstamo</h1>

    <form class="card card-body" method="post" th:action="@{/prestamos}">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="usuarioId" class="form-label">Usuario *</label>
                <select id="usuarioId" name="usuarioId" class="form-select" required>
                    <option value="" disabled selected>Selecciona un usuario</option>
                    <option th:each="usuario : ${usuarios}" th:value="${usuario.id}"
                            th:text="${usuario.nombreCompleto}">Usuario</option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="libroId" class="form-label">Libro *</label>
                <select id="libroId" name="libroId" class="form-select" required>
                    <option value="" disabled selected>Selecciona un libro</option>
                    <option th:each="libro : ${libros}" th:value="${libro.id}"
                            th:text="${libro.titulo}">Libro</option>
                </select>
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg"></i> Registrar préstamo
            </button>
            <a class="btn btn-outline-secondary" th:href="@{/prestamos}">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
