<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('usuarios')}"></nav>

<main class="container py-4">
  <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

  <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
    <h1 class="h3 mb-0">Usuarios</h1>
    <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">
      <i class="bi bi-plus-lg"></i> Nuevo usuario
    </a>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
          <th>Nombre</th>
          <th>DNI</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Alta</th>
          <th class="text-end">Préstamos</th>
          <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="usuario : ${usuarios}">
          <td>
            <a th:href="@{/usuarios/{id}(id=${usuario.id})}" th:text="${usuario.nombreCompleto}">Nombre</a>
          </td>
          <td th:text="${usuario.dni}">DNI</td>
          <td th:text="${usuario.email}">Email</td>
          <td th:text="${usuario.telefono} ?: '—'">Teléfono</td>
          <td th:text="${#temporals.format(usuario.fechaAlta, 'dd/MM/yyyy')}">01/01/2026</td>
          <td class="text-end">
            <span class="badge text-bg-secondary" th:text="${#lists.size(usuario.prestamos)}">0</span>
          </td>
          <td class="text-end text-nowrap">
            <a class="btn btn-sm btn-outline-primary" title="Editar"
             th:href="@{/usuarios/{id}/editar(id=${usuario.id})}">
              <i class="bi bi-pencil"></i>
            </a>
            <form class="d-inline" method="post"
               th:action="@{/usuarios/{id}/eliminar(id=${usuario.id})}"
               th:data-nombre="${usuario.nombreCompleto}"
               onsubmit="return confirm('¿Eliminar a «' + this.dataset.nombre + '»?')">
              <button class="btn btn-sm btn-outline-danger" type="submit" title="Eliminar">
                <i class="bi bi-trash"></i>
              </button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
