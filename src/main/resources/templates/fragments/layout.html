<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
  Fragmentos comunes a todas las páginas. Plantilla mínima de una vista nueva:

  <!DOCTYPE html>
  <html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Libros')}"></head>
  <body>
  <nav th:replace="~{fragments/layout :: navbar('libros')}"></nav>
  <main class="container py-4">
      <th:block th:replace="~{fragments/layout :: alertas}"></th:block>
      ... contenido ...
  </main>
  <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
  </html>

  navbar(seccion) marca como activa la opción del menú: inicio | libros | autores | usuarios | prestamos
-->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Biblioteca'">Biblioteca</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<nav th:fragment="navbar(seccion)" class="navbar navbar-expand-lg navbar-dark navbar-biblioteca">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            <i class="bi bi-book-half me-1"></i> Biblioteca
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal"
                aria-controls="menu-principal" aria-expanded="false" aria-label="Mostrar menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu-principal">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${seccion == 'inicio'} ? 'active'"
                       th:aria-current="${seccion == 'inicio'} ? 'page'" th:href="@{/}">
                        <i class="bi bi-house"></i> Inicio
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${seccion == 'libros'} ? 'active'"
                       th:aria-current="${seccion == 'libros'} ? 'page'" th:href="@{/libros}">
                        <i class="bi bi-journal-bookmark"></i> Libros
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${seccion == 'autores'} ? 'active'"
                       th:aria-current="${seccion == 'autores'} ? 'page'" th:href="@{/autores}">
                        <i class="bi bi-feather"></i> Autores
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${seccion == 'usuarios'} ? 'active'"
                       th:aria-current="${seccion == 'usuarios'} ? 'page'" th:href="@{/usuarios}">
                        <i class="bi bi-people"></i> Usuarios
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${seccion == 'prestamos'} ? 'active'"
                       th:aria-current="${seccion == 'prestamos'} ? 'page'" th:href="@{/prestamos}">
                        <i class="bi bi-arrow-left-right"></i> Préstamos
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Mensajes flash: redirectAttributes.addFlashAttribute("mensajeExito" | "mensajeError", "...") -->
<th:block th:fragment="alertas">
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i> <span th:text="${mensajeExito}">Operación realizada</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${mensajeError}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</th:block>

<!-- Estado de un préstamo con su color:
     <span th:replace="~{fragments/layout :: estadoPrestamo(${prestamo})}"></span> -->
<span th:fragment="estadoPrestamo(prestamo)" class="badge"
      th:classappend="${prestamo.estado.name() == 'VENCIDO'} ? 'text-bg-danger'
                      : (${prestamo.devuelto} ? 'text-bg-success' : 'text-bg-primary')"
      th:text="${prestamo.estado.etiqueta}">Activo</span>

<footer th:fragment="footer" class="pie border-top">
    <div class="container py-3 small text-body-secondary d-flex justify-content-between flex-wrap gap-2">
        <span>FP065 · UOC · Proyecto Biblioteca</span>
        <span>Erick Coll · Carles Miguel · Jacobo Barrera · Antonio Charneco</span>
    </div>
    <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
</footer>

</html>
