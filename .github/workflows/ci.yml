name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Compilación y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Construir y arrancar MariaDB, aplicación y Adminer
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Comprobar que la aplicación responde con datos
        run: |
          curl -fsS http://localhost:8080/actuator/health
          curl -fsS http://localhost:8080/ | grep -q 'Sistema de Gestión'
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Parar
        if: always()
        run: docker compose down -v
